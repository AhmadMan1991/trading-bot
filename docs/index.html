<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Engine · Dashboard</title>
<style>
  :root{
    --bg:#0b0e14; --bg2:#0f141d; --card:#151a23; --card2:#1b2230;
    --line:#242c3a; --text:#e6e9ef; --muted:#8b93a5; --muted2:#5f6779;
    --gold:#e0b64d; --green:#3fb950; --red:#f85149; --blue:#58a6ff;
    --amber:#d29922; --radius:14px; --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f6fa; --bg2:#eef1f7; --card:#ffffff; --card2:#f7f9fc;
      --line:#e3e8f0; --text:#1b2230; --muted:#5f6779; --muted2:#9aa3b2;
      --gold:#b2860f; --green:#1a7f37; --red:#cf222e; --blue:#0969da; --amber:#9a6700;
      --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
    }
  }
  :root[data-theme="light"]{
    --bg:#f4f6fa; --bg2:#eef1f7; --card:#ffffff; --card2:#f7f9fc;
    --line:#e3e8f0; --text:#1b2230; --muted:#5f6779; --muted2:#9aa3b2;
    --gold:#b2860f; --green:#1a7f37; --red:#cf222e; --blue:#0969da; --amber:#9a6700;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:0 0 64px;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 16px}
  header{
    position:sticky; top:0; z-index:5; background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line); margin-bottom:22px;
  }
  .head-in{display:flex; align-items:center; gap:14px; padding:14px 16px; max-width:1180px; margin:0 auto}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; letter-spacing:.2px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent)}
  .head-meta{margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px}
  .badge{font-size:11px; font-weight:600; padding:3px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted)}
  .badge.ok{color:var(--green); border-color:color-mix(in srgb,var(--green) 40%,transparent)}
  .badge.stale{color:var(--amber); border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
  .tbtn{cursor:pointer; background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:5px 9px; font-size:13px}
  .tbtn:hover{color:var(--text)}

  h2.sec{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
         margin:30px 2px 12px; display:flex; align-items:center; gap:8px}
  .grid{display:grid; gap:16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
  .card h3{margin:0 0 10px; font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em}

  /* KPI */
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi .v{font-size:30px; font-weight:750; letter-spacing:-.5px; line-height:1.1}
  .kpi .l{color:var(--muted); font-size:12px; margin-top:4px; text-transform:uppercase; letter-spacing:.05em}
  .kpi .sub{color:var(--muted2); font-size:12px; margin-top:6px}

  .pos{color:var(--green)} .neg{color:var(--red)} .neu{color:var(--muted)}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:650;
        padding:3px 9px; border-radius:999px; border:1px solid var(--line); background:var(--card2)}
  .chip.long,.chip.bull{color:var(--green); border-color:color-mix(in srgb,var(--green) 38%,transparent)}
  .chip.short,.chip.bear{color:var(--red); border-color:color-mix(in srgb,var(--red) 38%,transparent)}
  .chip.rng,.chip.neutral{color:var(--muted)}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}

  .scn{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .scn .card{padding:14px}
  .scn .tf{font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.06em}
  .scn .rowline{display:flex; justify-content:space-between; color:var(--muted2); font-size:12.5px; margin-top:7px}
  .scn .rowline b{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums}

  .sig{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .sig .top{display:flex; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap}
  .sig .asset{font-weight:700}
  .sig .when{margin-left:auto; color:var(--muted2); font-size:12px}
  .sig .levels{display:grid; grid-template-columns:repeat(2,1fr); gap:4px 14px; font-size:12.5px; color:var(--muted); margin-top:6px}
  .sig .levels b{color:var(--text); font-variant-numeric:tabular-nums; font-weight:600}
  .sig img{width:100%; border-radius:9px; margin-top:10px; border:1px solid var(--line); display:block; background:var(--card2)}

  .ev{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:none}
  .ev .t{font-weight:600} .ev .meta{color:var(--muted2); font-size:12px}
  .ev .vals{margin-left:auto; text-align:right; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--muted)}

  .muted{color:var(--muted)} .small{font-size:12.5px}
  .empty{color:var(--muted2); font-size:13.5px; padding:14px 2px}
  .ar{direction:rtl; text-align:right; font-size:15px; line-height:1.9}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .two{grid-template-columns:1fr 1fr}
  @media(max-width:720px){ .two{grid-template-columns:1fr} }
  a{color:var(--blue)}
  .err{background:color-mix(in srgb,var(--red) 12%,var(--card)); border:1px solid color-mix(in srgb,var(--red) 40%,transparent);
       color:var(--text); padding:16px; border-radius:var(--radius); margin-top:24px}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="brand"><span class="dot"></span> Gold Engine</div>
    <div class="head-meta">
      <span class="badge" id="freshness">—</span>
      <span id="updated">loading…</span>
      <button class="tbtn" id="theme" title="Toggle theme">◐</button>
    </div>
  </div>
</header>

<div class="wrap" id="app">
  <div class="empty">Loading dashboard…</div>
</div>

<script>
"use strict";
const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseTs(ts){ if(!ts) return null; const d=new Date(String(ts).replace(' ','T')); return isNaN(d)?null:d; }
function relTime(ts){
  const d=parseTs(ts); if(!d) return '—';
  const s=Math.floor((Date.now()-d)/1000);
  if(s<60) return 'just now';
  const m=Math.floor(s/60); if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago';
  const dd=Math.floor(h/24); if(dd<30) return dd+'d ago';
  return d.toISOString().slice(0,10);
}
function fmtPrice(v, asset){
  if(v==null||isNaN(v)) return '—';
  v=Number(v); const a=(asset||'').toUpperCase();
  let dp = 2;
  if(a.includes('JPY')) dp=3;
  else if(a.includes('EUR')||a.includes('GBP')||a.includes('AUD')||a.includes('USDCHF')) dp=5;
  else if(Math.abs(v)<10) dp=4;
  else if(a.includes('XAU')||a.includes('GOLD')||a.includes('BTC')||Math.abs(v)>=100) dp=2;
  return v.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
}
function signClass(v){ return v>0?'pos':v<0?'neg':'neu'; }
function biasClass(b){ b=(b||'').toUpperCase(); return b.includes('BULL')||b==='LONG'?'bull':b.includes('BEAR')||b==='SHORT'?'bear':b==='RANGING'?'rng':'neutral'; }
function dirClass(d){ d=(d||'').toUpperCase(); return d==='LONG'?'long':d==='SHORT'?'short':'neutral'; }

/* ---------- tiny dependency-free SVG charts ---------- */
function donut(parts){ // parts: [{v,color,label}]
  const total=parts.reduce((a,p)=>a+p.v,0)||1, R=52,C=64,sw=16,circ=2*Math.PI*R;
  let off=0, segs='';
  for(const p of parts){
    const frac=p.v/total, len=frac*circ;
    segs+=`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${p.color}" stroke-width="${sw}"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${C} ${C})"/>`;
    off+=len;
  }
  const tot=parts.reduce((a,p)=>a+p.v,0);
  return `<svg viewBox="0 0 128 128" width="128" height="128" aria-hidden="true">
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--line)" stroke-width="${sw}"/>
    ${segs}
    <text x="${C}" y="${C-2}" text-anchor="middle" font-size="26" font-weight="700" fill="var(--text)">${tot}</text>
    <text x="${C}" y="${C+16}" text-anchor="middle" font-size="11" fill="var(--muted)">trades</text>
  </svg>`;
}
function lineChart(points, {min=0,max=100,w=560,h=140,pad=24,guides=[]}={}){
  if(!points.length) return '<div class="empty">No history yet.</div>';
  const n=points.length, span=(max-min)||1;
  const X=i=> pad + (n<=1?0:(i*(w-2*pad)/(n-1)));
  const Y=v=> h-pad - ((v-min)/span)*(h-2*pad);
  let g='';
  for(const gv of guides){ const y=Y(gv.v); g+=`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text x="${w-pad}" y="${y-3}" text-anchor="end" font-size="10" fill="var(--muted2)">${esc(gv.label)}</text>`; }
  const d=points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const area=`M${X(0)} ${h-pad} `+points.map((p,i)=>`L${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ')+` L${X(n-1)} ${h-pad} Z`;
  const last=points[n-1];
  let dots='';
  [0,n-1].forEach(i=>{ if(points[i]) dots+=`<circle cx="${X(i)}" cy="${Y(points[i].v)}" r="3.5" fill="var(--gold)"/>`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    ${g}
    <path d="${area}" fill="color-mix(in srgb,var(--gold) 14%,transparent)"/>
    <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${X(n-1)}" y="${Y(last.v)-8}" text-anchor="end" font-size="11" font-weight="700" fill="var(--gold)">${last.v}</text>
  </svg>`;
}

/* ---------- renderers ---------- */
function kpis(p){
  if(!p||!Object.keys(p).length) return '';
  const wr=(p.win_rate!=null)?Math.round(p.win_rate*100):null;
  const tr=p.total_r, ar=p.avg_r;
  const card=(v,l,sub,cls)=>`<div class="card kpi"><div class="v ${cls||''}">${v}</div><div class="l">${l}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
  return `<h2 class="sec">Performance</h2><div class="grid kpis">
    ${card(tr!=null?(tr>0?'+':'')+tr+'R':'—','Total R','cumulative', signClass(tr))}
    ${card(wr!=null?wr+'%':'—','Win rate', (p.wins||0)+'W · '+(p.losses||0)+'L · '+(p.expired||0)+'E')}
    ${card(ar!=null?(ar>0?'+':'')+ar+'R':'—','Avg R','per trade', signClass(ar))}
    ${card(p.total!=null?p.total:'—','Trades','resolved')}
  </div>`;
}
function analytics(d){
  const p=d.performance||{};
  const haveDonut = (p.wins||p.losses||p.expired);
  let donutHtml='<div class="empty">No resolved trades yet.</div>';
  if(haveDonut){
    donutHtml=`<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      ${donut([{v:p.wins||0,color:'var(--green)'},{v:p.losses||0,color:'var(--red)'},{v:p.expired||0,color:'var(--muted2)'}])}
      <div class="legend" style="flex-direction:column;gap:8px">
        <span><i style="background:var(--green)"></i>Wins · ${p.wins||0}</span>
        <span><i style="background:var(--red)"></i>Losses · ${p.losses||0}</span>
        <span><i style="background:var(--muted2)"></i>Expired · ${p.expired||0}</span>
      </div></div>`;
  }
  // COT index trend (XAUUSD) from history
  const hist=(d.cot_history||[]).map(h=>({x:h.date, v:(h.data&&h.data.XAUUSD&&h.data.XAUUSD.cot_index)})).filter(p=>p.v!=null);
  const cotHtml = hist.length
    ? lineChart(hist,{min:0,max:100,guides:[{v:80,label:'80 overbought'},{v:20,label:'20 oversold'}]})
      + `<div class="small muted" style="margin-top:6px">XAUUSD COT index · ${hist.length} weeks (${esc(hist[0].x)} → ${esc(hist[hist.length-1].x)})</div>`
    : '<div class="empty">No COT history yet.</div>';
  return `<h2 class="sec">Analytics</h2><div class="grid two">
    <div class="card"><h3>Win / Loss</h3>${donutHtml}</div>
    <div class="card"><h3>COT positioning trend</h3>${cotHtml}</div>
  </div>`;
}
function scenarios(s){
  if(!s||!Object.keys(s).length) return '';
  const order=['1H','4H','Daily','Weekly'].filter(k=>s[k]);
  const keys=order.length?order:Object.keys(s);
  const cards=keys.map(k=>{ const v=s[k]||{}; const b=v.bias||'—';
    return `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span class="tf">${esc(k)}</span>
        <span class="chip ${biasClass(b)}">${esc(b)}</span>
      </div>
      <div class="rowline"><span>Price</span><b>${fmtPrice(v.price,'XAUUSD')}</b></div>
      <div class="rowline"><span>Support</span><b>${fmtPrice(v.support,'XAUUSD')}</b></div>
      <div class="rowline"><span>Resistance</span><b>${fmtPrice(v.resistance,'XAUUSD')}</b></div>
      <div class="rowline"><span>BOS</span><b class="${biasClass(v.bos)==='bull'?'pos':biasClass(v.bos)==='bear'?'neg':''}">${esc(v.bos||'—')}</b></div>
      ${v.chart?`<img src="${esc(v.chart)}" alt="${esc(k)} chart" loading="lazy" onerror="this.remove()" style="width:100%;border-radius:9px;margin-top:10px;border:1px solid var(--line)">`:''}
    </div>`;
  }).join('');
  return `<h2 class="sec">Market structure</h2><div class="grid scn">${cards}</div>`;
}
function openPositions(list){
  if(!list||!list.length) return `<h2 class="sec">Open positions</h2><div class="card"><div class="empty">No open positions.</div></div>`;
  const cards=list.map(o=>{
    const a=o.asset||'XAUUSD', d=o.direction||'';
    const conf=o.confidence!=null?Math.round(o.confidence*100)+'%':'';
    return `<div class="card">
      <div class="sig top">
        <span class="asset">${esc(a)}</span>
        <span class="chip ${dirClass(d)}">${esc(d)}</span>
        ${o.signal_label?`<span class="chip">${esc(o.signal_label)}</span>`:''}
        <span class="when">${conf}${o.risk_reward?` · ${o.risk_reward}R`:''}</span>
      </div>
      <div class="sig levels">
        <span>Entry <b>${fmtPrice(o.entry,a)}</b></span>
        <span>Stop <b>${fmtPrice(o.stop_loss,a)}</b></span>
        <span>TP1 <b>${fmtPrice(o.target_1,a)}</b></span>
        <span>TP2 <b>${fmtPrice(o.target_2,a)}</b></span>
      </div>
      ${o.reasoning?`<div class="small muted" style="margin-top:9px">${esc(o.reasoning)}</div>`:''}
    </div>`;
  }).join('');
  return `<h2 class="sec">Open positions</h2><div class="grid sig">${cards}</div>`;
}
function brief(b){
  if(!b||(!b.summary&&!(b.scores&&b.scores.length))) return '';
  let rows='';
  (b.scores||[]).forEach(r=>{
    rows+=`<tr><td>${esc(r.emoji||'')} ${esc(r.asset)}</td>
      <td><span class="chip ${biasClass(r.bias)}">${esc(r.bias)}</span></td>
      <td class="num ${signClass(r.score)}">${r.score>0?'+':''}${esc(r.score)}</td>
      <td>${esc(r.confidence||'')}</td>
      <td class="num">${fmtPrice(r.price,r.asset)}</td></tr>`;
  });
  return `<h2 class="sec">Daily brief ${b.date?`· ${esc(b.date)}`:''}</h2><div class="grid two">
    <div class="card"><h3>Executive summary</h3><div class="ar">${esc(b.summary||'—')}</div></div>
    <div class="card"><h3>Scores</h3>${rows?`<table><thead><tr><th>Asset</th><th>Bias</th><th class="num">Score</th><th>Conf.</th><th class="num">Price</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">No scores.</div>'}</div>
  </div>`;
}
function signals(list){
  const items=(list||[]).slice(0,12);
  if(!items.length) return `<h2 class="sec">Recent signals</h2><div class="card"><div class="empty">No signals recorded.</div></div>`;
  const cards=items.map(s=>{
    const a=s.asset||'', d=s.direction||'';
    const conf=s.score_or_conf!=null?(s.score_or_conf<=1?Math.round(s.score_or_conf*100)+'%':s.score_or_conf):'';
    return `<div class="card">
      <div class="sig top">
        <span class="asset">${esc(a)}</span>
        <span class="chip ${dirClass(d)}">${esc(d)}</span>
        ${s.signal_label?`<span class="chip">${esc(s.signal_label)}</span>`:''}
        <span class="when">${relTime(s.timestamp)}</span>
      </div>
      <div class="sig levels">
        <span>Entry <b>${fmtPrice(s.entry,a)}</b></span>
        <span>Stop <b>${fmtPrice(s.stop,a)}</b></span>
        <span>TP1 <b>${fmtPrice(s.tp1,a)}</b></span>
        <span>TP2 <b>${fmtPrice(s.tp2,a)}</b></span>
      </div>
      <div class="small muted" style="margin-top:6px">${s.layer?esc(s.layer.replace('_',' ')):''}${conf?` · ${conf}`:''}</div>
      ${s.chart?`<img src="${esc(s.chart)}" alt="setup chart" loading="lazy" onerror="this.remove()">`:''}
    </div>`;
  }).join('');
  return `<h2 class="sec">Recent signals</h2><div class="grid sig">${cards}</div>`;
}
function news(n){
  const evs=(n&&n.events)||[];
  let body;
  if(!evs.length) body='<div class="empty">No high-impact events scheduled.</div>';
  else body=evs.slice(0,10).map(e=>{
    const d=parseTs(e.time);
    const when=d?d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
    let act='';
    if(e.actual!=null){
      const beat = (parseFloat(e.actual)>parseFloat(e.forecast));
      act=`<span class="${beat?'pos':'neg'}">A ${esc(e.actual)}</span> · `;
    }
    return `<div class="ev">
      <span class="chip">${esc(e.currency||'')}</span>
      <div><div class="t">${esc(e.title)}</div><div class="meta">${when}</div></div>
      <div class="vals">${act}F ${esc(e.forecast??'—')} · P ${esc(e.previous??'—')}</div>
    </div>`;
  }).join('');
  return `<h2 class="sec">Economic calendar (USD, high-impact)</h2><div class="card">${body}</div>`;
}
function cot(c){
  if(!c||!c.data) return '';
  const rows=Object.entries(c.data).map(([k,v])=>{
    if(!v) return `<tr><td>${esc(k)}</td><td colspan="4" class="muted small">no data</td></tr>`;
    return `<tr><td>${esc(k)}</td>
      <td class="num">${v.net!=null?Number(v.net).toLocaleString():'—'}</td>
      <td class="num ${signClass(v.change)}">${v.change!=null?(v.change>0?'+':'')+Number(v.change).toLocaleString():'—'}</td>
      <td class="num">${v.cot_index??'—'}</td>
      <td><span class="chip ${biasClass(v.signal)}">${esc(v.signal||'—')}</span></td></tr>`;
  }).join('');
  return `<h2 class="sec">COT positioning ${c.summary?`· <span class="muted" style="text-transform:none;font-weight:400">${esc(c.summary)}</span>`:''}</h2>
    <div class="card"><table><thead><tr><th>Market</th><th class="num">Net</th><th class="num">Δ wk</th><th class="num">Index</th><th>Signal</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function render(d){
  const app=document.getElementById('app');
  const up=parseTs(d.updated_at);
  document.getElementById('updated').textContent = up ? 'Updated '+relTime(d.updated_at) : 'No update time';
  const fresh=document.getElementById('freshness');
  const ageMin = up ? (Date.now()-up)/60000 : Infinity;
  if(ageMin<90){ fresh.textContent='live'; fresh.className='badge ok'; }
  else if(ageMin<1440){ fresh.textContent='quiet'; fresh.className='badge'; }
  else { fresh.textContent='stale'; fresh.className='badge stale'; }

  app.innerHTML =
    kpis(d.performance) +
    analytics(d) +
    openPositions(d.open_positions) +
    scenarios(d.scenarios) +
    brief(d.daily_brief) +
    signals(d.signals) +
    cot(d.cot) +
    news(d.news);
}

/* theme toggle */
(function(){
  try{ const t=localStorage.getItem('ge-theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}
  document.getElementById('theme').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const mqDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
    const next = cur ? (cur==='dark'?'light':'dark') : (mqDark?'light':'dark');
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem('ge-theme',next); }catch(e){}
  });
})();

/* load (cache-busted) with graceful failure */
fetch('dashboard.json?t='+Date.now())
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(render)
  .catch(err=>{
    document.getElementById('app').innerHTML =
      `<div class="err"><b>Couldn't load dashboard data.</b><br>
       <span class="small muted">${esc(err.message)} — dashboard.json may not have been generated yet. It's written on each pipeline run.</span></div>`;
    document.getElementById('updated').textContent='load failed';
    document.getElementById('freshness').textContent='offline';
    document.getElementById('freshness').className='badge stale';
  });
</script>
</body>
</html>
